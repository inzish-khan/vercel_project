<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Designation Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Job Designation</h1>
            
            <form id="designationForm">
                <div class="form-group">
                    <label for="designation">Job Designation:</label>
                    <input 
                        type="text" 
                        id="designation" 
                        name="designation" 
                        placeholder="Enter your job designation"
                        required
                    >
                </div>
                
                <div id="validationMessage" class="validation-message hidden">
                    Please enter a job designation
                </div>
                
                <button type="submit" class="submit-button">Submit</button>
            </form>
            
            <div id="successMessage" class="success-message hidden">
                <div class="success-content">
                    <h2>Success!</h2>
                    <p>Your job designation has been submitted successfully.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .submit-btn {
    background-color: #ec4899;
    color: #ffffff;
    font-weight: bold;
    font-size: 1.25rem;
    padding: 1rem 3rem;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    transition: background-color 0.2s ease;
  }
  .submit-btn:hover {
    background-color: #db2777;
  }
</style>
</head>
<body>
  <button type="button" class="submit-btn" onclick="console.log('Submit clicked')">Submit</button>
</body>
</html>
